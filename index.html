<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte lumineuse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="lc">

    <div class="lc-scene">
      <div class="lc-carte" role="switch" tabindex="0" aria-checked="false" aria-label="Carte lumineuse">

        <div class="lc-couche" aria-hidden="true">
          <div class="lc-fente"></div>
          <div class="lc-lumiere">
            <div class="lc-petit"></div>
            <div class="lc-moyen"></div>
            <div class="lc-grand"></div>
          </div>
          <div class="lc-ombre">
            <div class="lc-o1"></div>
            <div class="lc-o2"></div>
            <div class="lc-o3"></div>
            <div class="lc-o4"></div>
          </div>
        </div>

        <div class="lc-contenu">
          <div class="lc-icone">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true">
              <defs>
                <linearGradient id="lc-degrade" x1="0" x2="0" y1="-1" y2="0.8">
                  <stop offset="0%" stop-color="#bbb"></stop>
                  <stop offset="100%" stop-color="#555"></stop>
                </linearGradient>
                <filter id="lc-reflet">
                  <feFlood flood-color="#fff2"></feFlood>
                  <feComposite operator="out" in2="SourceGraphic"></feComposite>
                  <feMorphology operator="dilate" radius="8"></feMorphology>
                  <feGaussianBlur stdDeviation="32"></feGaussianBlur>
                  <feComposite operator="atop" in2="SourceGraphic"></feComposite>
                </filter>
              </defs>
              <path fill="url(#lc-degrade)" filter="url(#lc-reflet)" d="M488.1 414.7V303.4L300.9 428l83.6 55.8zm254.1 137.7v-79.8l-59.8 39.9zM512 64C264.6 64 64 264.6 64 512s200.6 448 448 448s448-200.6 448-448S759.4 64 512 64m278 533c0 1.1-.1 2.1-.2 3.1c0 .4-.1.7-.2 1a14.2 14.2 0 0 1-.8 3.2c-.2.6-.4 1.2-.6 1.7c-.2.4-.4.8-.5 1.2c-.3.5-.5 1.1-.8 1.6c-.2.4-.4.7-.7 1.1c-.3.5-.7 1-1 1.5c-.3.4-.5.7-.8 1c-.4.4-.8.9-1.2 1.3c-.3.3-.6.6-1 .9c-.4.4-.9.8-1.4 1.1c-.4.3-.7.6-1.1.8c-.1.1-.3.2-.4.3L525.2 786c-4 2.7-8.6 4-13.2 4c-4.7 0-9.3-1.4-13.3-4L244.6 616.9c-.1-.1-.3-.2-.4-.3l-1.1-.8c-.5-.4-.9-.7-1.3-1.1c-.3-.3-.6-.6-1-.9c-.4-.4-.8-.8-1.200-1.300a7 7 0 0 1-.8-1c-.4-.5-.7-1-1-1.5c-.2-.4-.5-.7-.7-1.1c-.3-.5-.6-1.1-.8-1.6c-.2-.4-.4-.8-.5-1.2c-.2-.6-.4-1.2-.6-1.7c-.1-.4-.3-.8-.4-1.2c-.2-.7-.3-1.3-.4-2c-.1-.3-.1-.7-.2-1c-.1-1-.2-2.1-.2-3.1V427.9c0-1 .1-2.1.2-3.1c.1-.3.1-.7.2-1a14.2 14.2 0 0 1 .8-3.2c.2-.6.4-1.2.6-1.7c.2-.4.4-.8.5-1.2c.2-.5.5-1.1.8-1.6c.2-.4.4-.7.7-1.1c.6-.9 1.2-1.7 1.8-2.5c.4-.4.8-.9 1.2-1.3c.3-.3.6-.6 1-.9c.4-.4.9-.8 1.3-1.1s.7-.6 1.1-.8c.1-.1.3-.2.4-.3L498.7 239c8-5.3 18.5-5.3 26.5 0l254.1 169.1c.1.1.3.2.4.3l1.1.8l1.4 1.1c.3.3.6.6 1 .9c.4.4.8.8 1.2 1.3c.7.8 1.3 1.6 1.8 2.5c.2.4.5.7.7 1.1c.3.5.6 1 .8 1.6c.2.4.4.8.5 1.2c.2.6.4 1.2.6 1.7c.1.4.3.8.4 1.2c.2.7.3 1.3.4 2c.1.3.1.7.2 1c.1 1 .2 2.1.2 3.1zm-254.1 13.3v111.3L723.1 597l-83.6-55.8zM281.8 472.6v79.8l59.8-39.9zM512 456.1l-84.5 56.4l84.5 56.4l84.5-56.4zM723.1 428L535.9 303.4v111.3l103.6 69.1zM384.5 541.2L300.9 597l187.2 124.6V610.3z"></path>
            </svg>
          </div>

          <h2 class="lc-titre">Design lumineux</h2>
          <p class="lc-texte">La lumière épouse la forme<br>et révèle les détails</p>
        </div>

      </div>
    </div>

    <button class="lc-power" type="button" aria-label="Allumer la lumière">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="lc-arc" pathLength="100" d="M6.4 6.6 A8.5 8.5 0 1 0 17.6 6.6"></path>
        <path class="lc-barre" d="M12 3 V11"></path>
      </svg>
    </button>

    <p class="lc-etat" role="status" aria-live="polite">Lumière éteinte</p>

    <div class="lc-pastilles">
      <button class="lc-pastille" type="button" data-couleur="#ffffff" style="background:#ffffff" aria-label="Blanc"></button>
      <button class="lc-pastille" type="button" data-couleur="#ffb454" style="background:#ffb454" aria-label="Ambre"></button>
      <button class="lc-pastille" type="button" data-couleur="#5ee0ff" style="background:#5ee0ff" aria-label="Cyan"></button>
      <button class="lc-pastille" type="button" data-couleur="#b48cff" style="background:#b48cff" aria-label="Violet"></button>
      <button class="lc-pastille" type="button" data-couleur="#ff6f91" style="background:#ff6f91" aria-label="Rose"></button>
    </div>

    <p class="lc-copy">© 2026 <a href="https://kazx-dev.com/" target="_blank" rel="noopener">KΛZX</a> · Licence MIT</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
